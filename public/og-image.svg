<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdfcfa"/>
      <stop offset="100%" stop-color="#f5f0eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#c84b2f"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80"  r="180" fill="#c84b2f" opacity="0.04"/>
  <circle cx="1050" cy="580" r="120" fill="#c84b2f" opacity="0.04"/>

  <!-- Logo -->
  <text x="80" y="120" font-family="Georgia, serif" font-size="52" fill="#0f0e0d" letter-spacing="-1">Resume</text>
  <text x="316" y="120" font-family="Georgia, serif" font-size="52" font-style="italic" fill="#c84b2f" letter-spacing="-1">Verse</text>

  <!-- Headline -->
  <text x="80" y="240" font-family="Georgia, serif" font-size="72" fill="#0f0e0d" letter-spacing="-2" font-weight="400">Build Resumes That</text>
  <text x="80" y="330" font-family="Georgia, serif" font-size="72" fill="#c84b2f" letter-spacing="-2" font-style="italic">Get You Hired.</text>

  <!-- Subtext -->
  <text x="80" y="410" font-family="'DM Sans', Arial, sans-serif" font-size="28" fill="#8a8478" letter-spacing="0">AI-powered resume builder with ATS scoring, JD match,</text>
  <text x="80" y="450" font-family="'DM Sans', Arial, sans-serif" font-size="28" fill="#8a8478" letter-spacing="0">cover letter generator, and interview prep.</text>

  <!-- Feature pills -->
  <rect x="80"  y="510" width="160" height="44" rx="4" fill="#c84b2f" opacity="0.1"/>
  <text x="100" y="538" font-family="'DM Sans', Arial, sans-serif" font-size="20" fill="#c84b2f" font-weight="700">10 Templates</text>

  <rect x="256"  y="510" width="130" height="44" rx="4" fill="#c84b2f" opacity="0.1"/>
  <text x="276"  y="538" font-family="'DM Sans', Arial, sans-serif" font-size="20" fill="#c84b2f" font-weight="700">7 AI Tools</text>

  <rect x="402"  y="510" width="160" height="44" rx="4" fill="#c84b2f" opacity="0.1"/>
  <text x="422"  y="538" font-family="'DM Sans', Arial, sans-serif" font-size="20" fill="#c84b2f" font-weight="700">PDF + DOCX</text>

  <rect x="578"  y="510" width="150" height="44" rx="4" fill="#c84b2f" opacity="0.1"/>
  <text x="598"  y="538" font-family="'DM Sans', Arial, sans-serif" font-size="20" fill="#c84b2f" font-weight="700">Start Free</text>

  <!-- Bottom border -->
  <rect x="0" y="620" width="1200" height="10" fill="#c84b2f" opacity="0.15"/>
</svg>